name: Build macOS desktop (.dmg)

# Builds the TOKENHOURS Live desktop app for macOS and attaches the .dmg to a
# GitHub Release. Runs on a macOS runner (electron-builder can only produce a
# .dmg on macOS). Unsigned build — Gatekeeper users right-click → Open the first
# time. Trigger manually (choose the release tag) or automatically on release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the .dmg to"
        required: true
        default: v0.3.0
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install electron deps
        working-directory: electron
        run: npm ci

      - name: Build .dmg (unsigned)
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # skip code signing; no Apple cert
        run: npm run build:mac

      - name: Resolve target tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload .dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            electron/dist/TokenHours-Live.dmg --clobber

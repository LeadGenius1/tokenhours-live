<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TOKENHOURS Live · overlay</title>
  <style>
    /* Transparent overlay: the full dashboard (per-model breakdown, gauge, tokens,
       overhead, connectors) scaled down and corner-anchored, with the HUD's dark
       card / vignette / scanlines stripped so only the content floats. Shown on a
       slow show/hide timer; Electron hosts it transparent + click-through. Tune --scale. */
    :root { --scale: 0.25; --w: 680px; --h: 900px; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: ui-monospace, monospace; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end;
      padding: 8px; opacity: 0; transform: translateY(8px);
      transition: opacity 1.1s ease, transform 1.1s ease; pointer-events: none; }
    #wrap.show { opacity: 1; transform: translateY(0); }
    .frame { width: calc(var(--w) * var(--scale)); height: calc(var(--h) * var(--scale));
      overflow: hidden; background: transparent; }
    iframe { width: var(--w); height: var(--h); border: 0; background: transparent;
      transform: scale(var(--scale)); transform-origin: top left; }
  </style>
</head>
<body>
  <div id="wrap"><div class="frame"><iframe id="hud" src="/?token=__TH_TOKEN__" title="TOKENHOURS Live"></iframe></div></div>
  <script>
    // Strip the HUD's opaque chrome so the overlay reads as transparent (same-origin).
    const hud = document.getElementById("hud");
    hud.addEventListener("load", () => {
      try {
        const d = hud.contentDocument;
        d.documentElement.style.background = "transparent";
        d.body.style.background = "transparent";
        ["vignette", "scan", "grain"].forEach((id) => { const e = d.getElementById(id); if (e) e.style.display = "none"; });
      } catch (e) {}
    });
    // cadence: visible for VIS ms, hidden for HID ms, repeat.
    const VIS = 60000;   // ~1 minute visible
    const HID = 240000;  // hidden ~4 min → a show roughly every 5 minutes
    const wrap = document.getElementById("wrap");
    function cycle() {
      wrap.classList.add("show");
      setTimeout(() => { wrap.classList.remove("show"); setTimeout(cycle, HID); }, VIS);
    }
    setTimeout(cycle, 1500);
  </script>
</body>
</html>
